[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathwayseeker"
version = "1.0.0"
description = "Evidence-grounded reasoning over organism-specific metabolic graphs built from multi-omics data"
requires-python = ">=3.10"
license = {text = "BSD-2-Clause"}
authors = [
    {name = "Lummy M O Monteiro"},
    {name = "Marjolein T Oostrom"},
    {name = "Niaz Chowdhury"},
    {name = "Sutanay Choudhury"},
]
readme = "README.md"
keywords = ["multi-omics", "metabolic-pathways", "knowledge-graph", "proteomics", "metabolomics", "KEGG"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pandas>=2.0",
    "networkx>=3.0",
    "numpy",
    "requests",
    "pyvis",
    "tqdm",
    "openpyxl",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=0.40"]
mcp = ["mcp>=1.2"]
thermo = ["equilibrator-api>=0.4.5", "equilibrator-pathway>=0.4.4", "seaborn"]
dev = ["pytest"]
all = ["pathwayseeker[llm,mcp,dev]"]

[project.scripts]
pathwayseeker = "pathwayseeker.cli:main"

[project.urls]
Repository = "https://github.com/pnnl/PathwaySeeker"

[tool.setuptools.packages.find]
where = ["src"]
